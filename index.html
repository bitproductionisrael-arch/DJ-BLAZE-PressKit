<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="DJ BLAZE — Official Press Kit">
  <title>DJ BLAZE | Press Kit</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}
    body{min-height:100svh;display:grid;place-items:center;padding:36px 20px}
    main{width:min(100%,820px);text-align:center;display:flex;flex-direction:column;align-items:center;gap:48px}
    .brand{display:block;width:min(100%,640px);height:auto;object-fit:contain}
    .download{display:inline-flex;align-items:center;justify-content:center;min-height:60px;padding:16px 30px;background:#ff7600;color:#090909;font-size:17px;font-weight:800;letter-spacing:.035em;border-radius:7px;text-decoration:none;text-transform:uppercase;transition:background .2s,transform .2s}
    .download:hover{background:#ff9a38;transform:translateY(-2px)}
    .download:focus-visible{outline:3px solid #ffce00;outline-offset:5px}
    @media(max-width:500px){main{gap:40px}.download{width:100%;max-width:340px;font-size:15px}.brand{width:min(100%,450px)}}
  </style>
</head>
<body>
  <main>
    <img class="brand" src="./assets/dj-blaze-logo.webp" alt="BLAZE">
    <a class="download" href="./DJ_BLAZE_Press_Kit.pdf" download="DJ_BLAZE_Press_Kit.pdf" type="application/pdf">Download Press Kit ↓</a>
  </main>
</body>
</html>
